<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Dino Rush – Family Wizard</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" defer></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main class="dino-app">
    <header class="dino-header">
      <a href="../../">← Alle Spiele</a>
      <strong>Dino Rush</strong>
      <button id="sound-toggle" type="button" aria-pressed="true" aria-label="Ton ausschalten">Ton: An</button>
      <button id="pause-toggle" type="button" aria-pressed="false" aria-label="Runner pausieren" hidden>Pause</button>
      <div id="stats" aria-live="polite"></div>
    </header>
    <section class="dino-stage" aria-label="Dinosaurierspiel">
      <div id="game-view"></div>
      <div id="overlay">
        <div id="heading"></div>
        <div id="hud"></div>
        <div id="actions"></div>
        <div id="message" role="status"></div>
      </div>
    </section>
    <p class="dino-help" id="help">Bewege dich mit ← und → oder durch Wischen. Du schießt automatisch geradeaus.</p>
  </main>
</body>
</html>
