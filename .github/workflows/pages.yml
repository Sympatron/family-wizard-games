name: Games Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_run:
    workflows: [Games PR checks]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: games-pages-publish
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build stable site
        run: node stable/scripts/build.mjs --source stable --out site --revision "$(git -C stable rev-parse HEAD)"
      - name: Build development preview
        shell: bash
        run: |
          mkdir -p preview
          set +e
          git -C stable ls-remote --exit-code origin refs/heads/dev >/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git -C stable fetch --depth=1 origin refs/heads/dev
            git -C stable archive FETCH_HEAD | tar -x -C preview
            revision="$(git -C stable rev-parse FETCH_HEAD)"
          elif [ "$status" -eq 2 ]; then
            cp -R stable/. preview/
            revision="$(git -C stable rev-parse HEAD)"
          else
            exit "$status"
          fi
          node stable/scripts/build.mjs --source preview --out site/preview --revision "$revision"
      - name: Find open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
            jq -c '.[] | {number, title, sameRepository: (.head.repo.full_name == .base.repo.full_name)}' > open-prs.jsonl
      - name: Build isolated PR previews
        shell: bash
        run: |
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            if [[ "$(jq -r '.sameRepository' <<< "$pr")" != "true" ]]; then continue; fi
            mkdir -p pr-source
            git -C stable fetch --depth=1 origin "refs/pull/$number/head"
            revision="$(git -C stable rev-parse FETCH_HEAD)"
            git -C stable archive FETCH_HEAD | tar -x -C pr-source
            if ! node stable/scripts/build.mjs --source pr-source --out "site/preview/pr-$number" --revision "$revision"; then
              echo "::warning::Skipping invalid preview for PR #$number"
              rm -rf "site/preview/pr-$number"
            fi
            rm -rf pr-source
          done < open-prs.jsonl
      - name: Generate preview launcher with open PRs
        run: node stable/scripts/preview-index.mjs --site site/preview --prs open-prs.jsonl --repository "$GITHUB_REPOSITORY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
